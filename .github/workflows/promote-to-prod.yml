name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to promote
        required: false
        default: main
      include_edu:
        description: Include NeurodeskEDU in the assembled site
        required: true
        default: true
        type: boolean
      publish:
        description: Publish the assembled site to neurodesk.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.source-revision.outputs.sha }}
    env:
      PROD_OWNER: neurodesk
      PROD_REPO: neurodesk.org
      PROD_BRANCH: site
    steps:
      - name: Checkout Astro source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record promoted revision
        id: source-revision
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth matplotlib

      - name: Test user metrics generator
        run: python -m unittest tests/test_write_user_metrics.py

      - name: Generate applications list
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          FAIL_ON_APPLIST_ERROR: ${{ vars.FAIL_ON_APPLIST_ERROR }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN is required for a production candidate" >&2
            exit 1
          fi

          EXTRA_ARGS=()
          case "${FAIL_ON_APPLIST_ERROR,,}" in
            true|1|yes)
              EXTRA_ARGS+=(--fail-on-error)
              ;;
          esac

          python .github/workflows/write-app-json.py \
            --zenodo_token "$ZENODO_TOKEN" \
            "${EXTRA_ARGS[@]}"

      - name: Generate user metrics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: python .github/workflows/write-user-metrics.py --output public/data/user-metrics.json

      - name: Verify user metrics
        run: |
          python -c 'import json; data = json.load(open("public/data/user-metrics.json")); assert not data.get("unavailable") and data.get("months"), "Generated user metrics are unavailable or empty"'

      - name: Generate Neurodesk App download metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/write-neurodeskapp-metrics.py --output public/docs/overview/neurodeskapp_metrics.png

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
          cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro production site
        run: pnpm build

      - name: Verify applications data
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist/data/applist.json','utf8'));const n=Array.isArray(d.list)?d.list.length:0;console.log('Applications:',n);if(n<=1)process.exit(1)"

      - name: Checkout NeurodeskEDU
        run: |
          git clone --depth=1 --branch gh-pages \
            https://github.com/neurodesk/neurodeskedu.git \
            "${{ runner.temp }}/neurodeskedu"

      - name: Include legacy example notebooks path
        run: |
          mkdir -p dist/example-notebooks
          rsync -a --delete \
            "${{ runner.temp }}/neurodeskedu/" \
            dist/example-notebooks/ \
            --exclude=.git
          test -f dist/example-notebooks/intro.html

      - name: Include NeurodeskEDU
        if: ${{ inputs.include_edu }}
        run: |
          mkdir -p dist/edu
          rsync -a --delete \
            "${{ runner.temp }}/neurodeskedu/" \
            dist/edu/ \
            --exclude=.git
          if [ ! -f dist/edu/intro.html ] && [ ! -f dist/edu/index.html ]; then
            echo "NeurodeskEDU entry page was not found" >&2
            exit 1
          fi

      - name: Checkout Neurocontainers UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: neurodesk/neurocontainers-ui
          path: .production-inputs/neurocontainers-ui

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build Neurocontainers UI
        working-directory: .production-inputs/neurocontainers-ui
        env:
          PAGES_BASE_PATH: /neurocontainers-ui
        run: |
          bun install
          bun run build

      - name: Include Neurocontainers UI
        run: |
          mkdir -p dist/neurocontainers-ui
          rsync -a --delete \
            .production-inputs/neurocontainers-ui/out/ \
            dist/neurocontainers-ui/
          test -f dist/neurocontainers-ui/index.html

      - name: Add production custom domain
        run: printf '%s\n' 'neurodesk.org' > dist/CNAME

      - name: Verify assembled production candidate
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/example-notebooks/intro.html
          test -f dist/neurocontainers-ui/index.html
          if ${{ inputs.include_edu }}; then
            test -d dist/edu
          fi

      - name: Upload production candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-site-candidate-${{ github.run_id }}
          path: dist/
          retention-days: 7

      - name: Push candidate to production repository
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          INCLUDE_EDU: ${{ inputs.include_edu }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROD_REPO_TOKEN is required to publish" >&2
            exit 1
          fi

          PROD_WORKTREE="${{ runner.temp }}/prod-site"
          git clone --branch "${PROD_BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${PROD_OWNER}/${PROD_REPO}.git" \
            "$PROD_WORKTREE"

          if [ "$INCLUDE_EDU" = "true" ]; then
            rsync -a --delete --exclude=.git dist/ "$PROD_WORKTREE/"
          else
            rsync -a --delete --exclude=.git --exclude=edu/ dist/ "$PROD_WORKTREE/"
          fi

          cd "$PROD_WORKTREE"
          git config user.name "production-promotion-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No production changes to publish"
          else
            git commit -m "Deploy ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
            git push origin "${PROD_BRANCH}"
          fi

      - name: Trigger GitHub Pages production deployment
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${PROD_OWNER}/${PROD_REPO}/dispatches" \
            -f event_type=publish-site

  deploy-preview:
    name: Deploy candidate to neurodesk.github.io
    if: ${{ inputs.publish == false && github.event.repository.name == 'neurodesk.github.io' }}
    needs: promote
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-site-candidate-${{ github.run_id }}
          path: dist

      - name: Remove production custom domain marker
        run: |
          rm -f dist/CNAME
          touch dist/.nojekyll

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages-branch

      - name: Update GitHub Pages branch
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
        run: |
          rsync -a --delete \
            --exclude=.git \
            --exclude='pr-*/' \
            dist/ pages-branch/

          cd pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No GitHub Pages candidate changes to publish"
          else
            git commit -m "Deploy candidate ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
            git push origin gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
