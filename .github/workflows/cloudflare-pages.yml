name: Cloudflare Pages

on:
  push:
    branches: ["main"]
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate-applist:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore cached applist.json
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-applist
        with:
          path: public/data/applist.json
          key: applist-json-${{ github.run_id }}
          restore-keys: applist-json-

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install requests

      - name: Write applist.json
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          FAIL_ON_APPLIST_ERROR: ${{ vars.FAIL_ON_APPLIST_ERROR }}
        run: |
          if [ -n "$ZENODO_TOKEN" ]; then
            EXTRA_ARGS=()
            case "${FAIL_ON_APPLIST_ERROR,,}" in
              true|1|yes)
                echo "FAIL_ON_APPLIST_ERROR is enabled; running in strict mode."
                EXTRA_ARGS+=(--fail-on-error)
                ;;
              *)
                echo "FAIL_ON_APPLIST_ERROR is not enabled; running in best-effort mode."
                ;;
            esac
            python .github/workflows/write-app-json.py --zenodo_token "$ZENODO_TOKEN" "${EXTRA_ARGS[@]}"
          else
            echo "ZENODO_TOKEN not set — skipping write-app-json.py"
          fi

      - name: Save applist.json to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: public/data/applist.json
          key: applist-json-${{ github.run_id }}

      - name: Upload applist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: applist-json
          path: public/data/applist.json
          retention-days: 7

  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Python data generation (must run BEFORE Astro build) ---

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth matplotlib

      - name: Test user metrics generator
        run: python -m unittest tests/test_write_user_metrics.py

      - name: Write user metrics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: python .github/workflows/write-user-metrics.py --output public/data/user-metrics.json

      - name: Verify user metrics
        run: |
          python -c 'import json; data = json.load(open("public/data/user-metrics.json")); assert not data.get("unavailable") and data.get("months"), "Generated user metrics are unavailable or empty"'

      - name: Write Neurodesk App download metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/write-neurodeskapp-metrics.py --output public/docs/overview/neurodeskapp_metrics.png

      # --- Astro build (now has all generated data in public/) ---
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          version: 12
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Build with Astro
        run: npx astro build

      - name: Verify assets in dist
        run: |
          set -e
          MISSING=0

          # Determine if we're on a fork (paths will be patched)
          if [[ "${{ github.repository }}" != "neurodesk/neurodesk.github.io-astro" ]]; then
            REPO_PATH="${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            echo "Fork detected: will strip /${REPO_PATH}/ prefix when checking files"
          fi

          # Find referenced /static/ paths in generated HTML/CSS/JS and ensure files exist
          # Use while-read loop to handle filenames with spaces properly
          while IFS= read -r p; do
            # For forks, strip the repo path prefix to get the actual file location
            if [[ "${{ github.repository }}" != "neurodesk/neurodesk.github.io-astro" ]]; then
              # Transform /<owner>.github.io/<repo>/static/... → /static/...
              FILE_PATH="${p#/"${REPO_PATH}"}"
              echo "DEBUG: Checking $p → ${FILE_PATH}"
            else
              FILE_PATH="${p}"
            fi

            FILE="dist${FILE_PATH}"
            if [ ! -f "$FILE" ]; then
              echo "Missing asset: $p -> expected $FILE"
              MISSING=1
            fi
          done < <(grep -Rho 'src="\/[^"]*static\/[^"]*"' dist/ | sed -E 's/.*src="(\/[^"]*)".*/\1/' | sort -u)

          if [ "$MISSING" -eq 1 ]; then
            echo "One or more assets missing from dist/ — failing the job"
            exit 1
          fi


      # Note: Do NOT copy the production CNAME during staging deploys.

      - name: Merge PR previews into artifact (preserve pr-* directories)
        run: |
          set -e
          # Check if gh-pages branch exists
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "Found gh-pages branch, merging preview directories..."

            # Fetch gh-pages branch
            git fetch origin gh-pages:refs/remotes/origin/gh-pages

            # Create temporary worktree for gh-pages
            mkdir -p /tmp/gh-pages-checkout
            git worktree add /tmp/gh-pages-checkout origin/gh-pages

            # Copy any pr-* directories into dist/ (preserving previews)
            if ls /tmp/gh-pages-checkout/pr-* 1> /dev/null 2>&1; then
              echo "Copying preview directories to dist/..."
              cp -r /tmp/gh-pages-checkout/pr-* dist/ || true
              echo "Previews merged successfully"
            else
              echo "No preview directories found (no active PRs)"
            fi

            # Clean up worktree
            git worktree remove /tmp/gh-pages-checkout
          else
            echo "No gh-pages branch exists yet, skipping preview merge"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-dist
          path: dist/
          retention-days: 1

  check-links:
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js for Linkspector
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1
        with:
          reviewdog_version: v0.21.2

      - name: Run Linkspector with reviewdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          set -euo pipefail

          echo '::group::Installing linkspector'
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No system Chrome or Chromium executable found" >&2
            exit 1
          fi
          export PUPPETEER_EXECUTABLE_PATH="$CHROME_BIN"
          echo "Using Chrome at $PUPPETEER_EXECUTABLE_PATH"
          npm install -g @umbrelladocs/linkspector@0.5.2
          linkspector --version
          echo '::endgroup::'

          echo '::group::Setting up Chrome Linux sandbox'
          if [ "$(lsb_release -rs)" = "24.04" ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          echo '::endgroup::'

          echo '::group::Running linkspector with reviewdog'
          set +e
          linkspector check -c .linkspector.yml -j |
            reviewdog -f=rdjson \
              -name="Linkspector" \
              -reporter="github-pr-check" \
              -filter-mode="nofilter" \
              -fail-level="any" \
              -level="error"
          linkspector_status=$?
          set -e
          echo '::endgroup::'

          echo '::group::Running linkspector stats'
          linkspector check -c .linkspector.yml -s || true
          echo '::endgroup::'

          exit "$linkspector_status"

  deploy:
    needs: [build, generate-applist]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-dist
          path: dist

      - name: Download applist artifact
        id: download-applist
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: applist-json
          path: dist/data

      - name: Restore cached applist.json (fallback)
        if: steps.download-applist.outcome == 'failure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dist/data/applist.json
          key: applist-json-${{ github.run_id }}
          restore-keys: applist-json-

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=neurodesk-preview --branch=${{ github.ref_name }}
